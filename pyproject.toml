[project]
name = "geostat_utils"
version = "1.0.0"
description = 'Library for the geostatistical courses at ENSG. It is based on several library, mainly gstlearn. the library include function to modify the graph plotted.'

# project
authors = [
{ name = "Amandine Fratani", email = "amandine.fratani@univ-lorraine.fr" },
{ name = "Guillaume Caumon", email = "guillaume.caumon@univ-lorraine.fr"},
{ name = "Oumayma Razik" }
]

readme = "README.md"
keywords = ["geostatistics", "geology", "ENSG"]

requires-python = ">=3.13, <=3.14"
dependencies = [
    "catboost>=1.2.10",
    "gstlearn>=1.11.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "notebook>=7.6.0",
    "numpy>=1.24.0",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "scikit-gstat>=1.0.23",
    "scikit-learn>=1.9.0",
    "xgboost>=3.3.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python"
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
